<!doctype html><html><head><meta charset='utf-8'><style>html,body{margin:0;padding:0;background:#fff}svg{display:block}</style></head><body><svg viewBox="0 0 1500 1560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
    <defs>
      <marker id="a4" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
        <path d="M0,0 L9,4 L0,8 z" fill="#475569"/>
      </marker>
    </defs>
    <g font-size="13.5" text-anchor="middle">
      <!-- START -->
      <ellipse cx="750" cy="40" rx="90" ry="30" fill="#DCFCE7" stroke="#15803D" stroke-width="2.5"/>
      <text x="750" y="46" font-weight="700" fill="#14532D">START</text>
      <line x1="750" y1="70" x2="750" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#a4)"/>

      <!-- open browser -->
      <rect x="610" y="110" width="280" height="56" rx="8" fill="#EFF6FF" stroke="#1B4DB1" stroke-width="2.4"/>
      <text x="750" y="133" fill="#132A5E">Open SIMES in a</text><text x="750" y="152" fill="#132A5E">web browser</text>
      <line x1="750" y1="166" x2="750" y2="206" stroke="#475569" stroke-width="2" marker-end="url(#a4)"/>

      <!-- sign in -->
      <rect x="610" y="206" width="280" height="56" rx="8" fill="#EFF6FF" stroke="#1B4DB1" stroke-width="2.4"/>
      <text x="750" y="229" fill="#132A5E">Sign in with Microsoft</text><text x="750" y="248" fill="#132A5E">(SSO)</text>
      <line x1="750" y1="262" x2="750" y2="302" stroke="#475569" stroke-width="2" marker-end="url(#a4)"/>

      <!-- decision creds -->
      <polygon points="750,302 900,362 750,422 600,362" fill="#FEF9C3" stroke="#A16207" stroke-width="2.4"/>
      <text x="750" y="358" fill="#713F12" font-weight="600">Credentials</text>
      <text x="750" y="376" fill="#713F12">valid?</text>
      <text x="795" y="345" font-size="12" fill="#15803D" font-weight="700">YES</text>
      <!-- no branch -->
      <line x1="600" y1="362" x2="300" y2="362" stroke="#475569" stroke-width="2" marker-end="url(#a4)"/>
      <text x="470" y="352" font-size="12" fill="#B91C1C" font-weight="700">NO</text>
      <rect x="70" y="334" width="230" height="56" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2.4"/>
      <text x="185" y="357" fill="#7F1D1D">Show error message</text><text x="185" y="376" fill="#7F1D1D">and retry</text>
      <path d="M185,390 L185,440 L600,440" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a4)"/>
      <line x1="750" y1="422" x2="750" y2="466" stroke="#475569" stroke-width="2" marker-end="url(#a4)"/>

      <!-- load role -->
      <rect x="610" y="466" width="280" height="56" rx="8" fill="#EFF6FF" stroke="#1B4DB1" stroke-width="2.4"/>
      <text x="750" y="489" fill="#132A5E">Load user role from</text><text x="750" y="508" fill="#132A5E">the database</text>
      <line x1="750" y1="522" x2="750" y2="562" stroke="#475569" stroke-width="2" marker-end="url(#a4)"/>

      <!-- role decision -->
      <polygon points="750,562 950,632 750,702 550,632" fill="#FEF9C3" stroke="#A16207" stroke-width="2.4"/>
      <text x="750" y="628" fill="#713F12" font-weight="600">Which role?</text>
      <text x="750" y="648" fill="#713F12" font-size="12">(branch)</text>

      <!-- four columns -->
      <g>
        <line x1="610" y1="700" x2="200" y2="770" stroke="#475569" stroke-width="2" marker-end="url(#a4)"/>
        <line x1="690" y1="690" x2="560" y2="770" stroke="#475569" stroke-width="2" marker-end="url(#a4)"/>
        <line x1="810" y1="690" x2="940" y2="770" stroke="#475569" stroke-width="2" marker-end="url(#a4)"/>
        <line x1="890" y1="700" x2="1300" y2="770" stroke="#475569" stroke-width="2" marker-end="url(#a4)"/>
      </g>

      <!-- student col -->
      <rect x="80" y="770" width="240" height="48" rx="8" fill="#E0E7FF" stroke="#1B4DB1" stroke-width="2.4"/>
      <text x="200" y="800" font-weight="700" fill="#132A5E">STUDENT DASHBOARD</text>
      <rect x="60" y="840" width="280" height="260" rx="10" fill="#F8FAFC" stroke="#1B4DB1" stroke-width="1.8"/>
      <text x="200" y="872" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Time In / Time Out (DTR)</text>
      <text x="200" y="900" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Write daily logs</text>
      <text x="200" y="928" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Submit requirements</text>
      <text x="200" y="956" font-size="12.5" fill="#334155" text-anchor="start">â€¢ View weekly tasks</text>
      <text x="200" y="984" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Read announcements</text>
      <text x="200" y="1012" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Message supervisor</text>
      <text x="200" y="1040" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Update profile</text>

      <!-- supervisor col -->
      <rect x="440" y="770" width="240" height="48" rx="8" fill="#E0E7FF" stroke="#1B4DB1" stroke-width="2.4"/>
      <text x="560" y="800" font-weight="700" fill="#132A5E">SUPERVISOR DASHBOARD</text>
      <rect x="420" y="840" width="280" height="260" rx="10" fill="#F8FAFC" stroke="#1B4DB1" stroke-width="1.8"/>
      <text x="560" y="872" font-size="12.5" fill="#334155" text-anchor="start">â€¢ View assigned interns</text>
      <text x="560" y="900" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Review / approve DTR</text>
      <text x="560" y="928" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Grade submissions</text>
      <text x="560" y="956" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Give log feedback</text>
      <text x="560" y="984" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Monitor progress</text>
      <text x="560" y="1012" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Message coordinator</text>

      <!-- coordinator col -->
      <rect x="820" y="770" width="240" height="48" rx="8" fill="#E0E7FF" stroke="#1B4DB1" stroke-width="2.4"/>
      <text x="940" y="800" font-weight="700" fill="#132A5E">COORDINATOR DASHBOARD</text>
      <rect x="800" y="840" width="280" height="260" rx="10" fill="#F8FAFC" stroke="#1B4DB1" stroke-width="1.8"/>
      <text x="940" y="872" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Create students</text>
      <text x="940" y="900" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Create requirements</text>
      <text x="940" y="928" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Ask companies to host</text>
      <text x="940" y="956" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Review submissions</text>
      <text x="940" y="984" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Monitor DTR (course)</text>
      <text x="940" y="1012" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Message supervisors</text>
      <text x="940" y="1040" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Export reports</text>

      <!-- admin col -->
      <rect x="1180" y="770" width="240" height="48" rx="8" fill="#E0E7FF" stroke="#1B4DB1" stroke-width="2.4"/>
      <text x="1300" y="800" font-weight="700" fill="#132A5E">ADMIN DASHBOARD</text>
      <rect x="1160" y="840" width="280" height="260" rx="10" fill="#F8FAFC" stroke="#1B4DB1" stroke-width="1.8"/>
      <text x="1300" y="872" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Manage all accounts</text>
      <text x="1300" y="900" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Manage companies</text>
      <text x="1300" y="928" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Post announcements</text>
      <text x="1300" y="956" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Oversee requirements</text>
      <text x="1300" y="984" font-size="12.5" fill="#334155" text-anchor="start">â€¢ View audit logs</text>
      <text x="1300" y="1012" font-size="12.5" fill="#334155" text-anchor="start">â€¢ Generate reports</text>
      <text x="1300" y="1040" font-size="12.5" fill="#334155" text-anchor="start">â€¢ System settings</text>

      <!-- converge -->
      <line x1="200" y1="1100" x2="200" y2="1160" stroke="#475569" stroke-width="2"/>
      <line x1="560" y1="1100" x2="560" y2="1160" stroke="#475569" stroke-width="2"/>
      <line x1="940" y1="1100" x2="940" y2="1160" stroke="#475569" stroke-width="2"/>
      <line x1="1300" y1="1100" x2="1300" y2="1160" stroke="#475569" stroke-width="2"/>
      <line x1="200" y1="1160" x2="1300" y2="1160" stroke="#475569" stroke-width="2"/>
      <line x1="750" y1="1160" x2="750" y2="1200" stroke="#475569" stroke-width="2" marker-end="url(#a4)"/>

      <!-- decision any more? -->
      <polygon points="750,1200 900,1258 750,1316 600,1258" fill="#FEF9C3" stroke="#A16207" stroke-width="2.4"/>
      <text x="750" y="1254" fill="#713F12" font-weight="600">More tasks</text>
      <text x="750" y="1272" fill="#713F12">to do?</text>
      <text x="795" y="1244" font-size="12" fill="#15803D" font-weight="700">YES</text>
      <text x="640" y="1300" font-size="12" fill="#B91C1C" font-weight="700">NO</text>
      <!-- yes loop back -->
      <path d="M900,1258 L1080,1258 L1080,1385 L750,1385 L750,706" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a4)" stroke-dasharray="0"/>
      <!-- no -> logout -->
      <line x1="750" y1="1316" x2="750" y2="1356" stroke="#475569" stroke-width="2" marker-end="url(#a4)"/>
      <rect x="610" y="1356" width="280" height="56" rx="8" fill="#EFF6FF" stroke="#1B4DB1" stroke-width="2.4"/>
      <text x="750" y="1379" fill="#132A5E">Log out / close</text><text x="750" y="1398" fill="#132A5E">the browser</text>
      <line x1="750" y1="1412" x2="750" y2="1452" stroke="#475569" stroke-width="2" marker-end="url(#a4)"/>
      <ellipse cx="750" cy="1500" rx="90" ry="34" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2.5"/>
      <text x="750" y="1506" font-weight="700" fill="#7F1D1D">END</text>
    </g>
  </svg></body></html>
